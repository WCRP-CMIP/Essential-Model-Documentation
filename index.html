
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    window.addEventListener("load", function () {
      const url = new URL(window.location.href);

      if (!url.pathname.replace(/\/+$/, "").endsWith("/docs")) {
        url.pathname =
          url.pathname.replace(/\/+$/, "") + "/docs/";
        window.location.replace(url.href);
      }
    });
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
