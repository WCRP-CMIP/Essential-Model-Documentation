name: Update EMD Health

on:
  workflow_dispatch:
  schedule:
    # Every 2 weeks on Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'

jobs:
  update-emd-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
      
      - name: Authenticate with GitHub
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Update EMD Health
        run: python3 docs/EMD_health/scripts/pr_all_timeline.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/assets/pr_all_timeline_data.json; then
            echo "No changes to commit"
          else
            git add docs/assets/pr_all_timeline_data.json
            git commit -m "chore: update EMD health data"
            git push origin docs
          fi
