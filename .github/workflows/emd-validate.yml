name: ✓ EMD validation
description: Validate every EMD record with the pydantic models in .github/EMD_tests, update the badge, and alert the reviewers on failures

on:
  schedule:
    - cron: '0 6 1,15 * *'   # 06:00 UTC on the 1st and 15th of each month
  workflow_dispatch:          # the "Run workflow" button

permissions:
  contents: write   # push the badge data to the emd-badges branch
  issues: write     # open, comment on or close the alert issue

concurrency:
  group: emd-validation
  cancel-in-progress: false

env:
  REVIEWERS: '@WCRP-CMIP/emd-reviewers'
  ISSUE_TITLE: 'EMD validation failures'
  BADGE_BRANCH: emd-badges
  BADGE_FILE: emd-validation.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r .github/EMD_tests/requirements.txt

      # Prints the coloured report to the log. Exits 1 when a file fails, which marks the run red.
      - name: Validate every record
        id: report
        env:
          COLUMNS: '180'
        run: python .github/EMD_tests

      # shields.io reads this JSON. It lives on its own branch so src-data gets no badge commits.
      - name: Update the badge
        if: always() && steps.report.outputs.files != ''
        env:
          FILES: ${{ steps.report.outputs.files }}
          FAILED: ${{ steps.report.outputs.failed }}
        run: |
          colour=$([ "$FAILED" = "0" ] && echo brightgreen || echo red)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$BADGE_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$BADGE_BRANCH"
            git worktree add --detach "$dir" FETCH_HEAD
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan "$BADGE_BRANCH"
            git -C "$dir" rm -rfq .
          fi
          printf '{"schemaVersion": 1, "label": "EMD errors", "message": "%s / %s files", "color": "%s"}\n' \
            "$FAILED" "$FILES" "$colour" > "$dir/$BADGE_FILE"
          git -C "$dir" add "$BADGE_FILE"
          if git -C "$dir" diff --cached --quiet; then
            echo "Badge unchanged."
          else
            git -C "$dir" commit -qm "EMD validation: $FAILED of $FILES files fail"
            git -C "$dir" push origin "HEAD:$BADGE_BRANCH"
          fi

      # One rolling issue: opened on the first failing run, commented on by later ones.
      - name: Alert the reviewers
        if: always() && steps.report.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILES: ${{ steps.report.outputs.files }}
          FAILED: ${{ steps.report.outputs.failed }}
          WARNED: ${{ steps.report.outputs.warned }}
        run: |
          if [ -n "$FILES" ]; then
            summary="**$FAILED of $FILES files fail** validation ($WARNED more load with warnings)."
          else
            summary="**The validation did not complete.** It stopped before reporting."
          fi
          body="$REVIEWERS $summary See the run for the full report: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                   --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close the alert when every file passes
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILES: ${{ steps.report.outputs.files }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                   --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All $FILES files pass. Closed by $RUN_URL"
          fi
