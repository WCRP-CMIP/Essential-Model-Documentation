name: "Modify: change a field in an existing EMD entry"
description: Update one or several JSON fields in any existing src-data file (opens a PR for review)
title: "[EMD] Modify: [do not edit]"
labels: ['emd-submission', 'modify', 'Review']
body:
  - type: markdown
    attributes:
      value: |
        # Modify an existing entry
        
        Use this form to change one or more fields in an existing JSON file on `src-data`. For a single field use **Field name** and **New value**; for several at once use **Changes**. The change is opened as a pull request for review — nothing is pushed directly.
        
        > [!NOTE]
        > If the file or folder does not exist the submission will fail. Use the relevant **stage** form to create new entries.

  - type: dropdown
    id: folder
    attributes:
      label: Folder
      description: |
        The data folder containing the file you want to modify.
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **Data folder**
        
        Pick the folder that contains the file you want to change.
        
        If you're not sure which folder a given entry lives in, browse `src-data` on GitHub.
        
        </details>
      options:
        - "component_config"
        - "horizontal_computational_grid"
        - "horizontal_grid_cell"
        - "horizontal_subgrid"
        - "model"
        - "model_component"
        - "model_family"
        - "vertical_computational_grid"
    validations:
      required: true

  - type: input
    id: filename
    attributes:
      label: Filename
      description: |
        Filename to modify (with or without `.json`).
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **Existing filename**
        
        The `@id` of the file you want to change. With or without the trailing `.json` — the handler will add it if missing.
        
        **Example:** for `model/canesm5-1.json` enter `canesm5-1`.
        
        If the file does not exist the submission will fail.
        
        </details>
      placeholder: "canesm5-1"
    validations:
      required: true

  - type: input
    id: key
    attributes:
      label: Field name
      description: |
        The JSON key (top-level only) to add or replace. Leave blank if you are using **Changes** below.
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **Field name**
        
        The JSON key to update. Nested keys are supported with dot notation, e.g. `metadata.version`.
        
        **The key must already exist on the file** — if it does not, the submission will fail. Use the relevant stage form to add new fields.
        
        Leave this blank if you are changing several fields via **Changes**.
        
        </details>
      placeholder: "description"

  - type: textarea
    id: value
    attributes:
      label: New value
      description: |
        The new value. If it parses as JSON (e.g. a list, number, boolean, or object) it is stored as that type; otherwise it is stored as a string. Leave blank if you are using **Changes**.
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **New value**
        
        Write the new value as you want it to appear in the JSON. Examples:
        
        - A string: `My new description`
        - A list: `["https://doi.org/...", "https://doi.org/..."]`
        - A number: `2024`
        - A boolean: `true`
        - An object: `{"key": "value"}`
        
        If the value parses as JSON it is stored as that type; otherwise it is kept as a string.
        
        </details>
      placeholder: "A scientific overview of the model..."

  - type: textarea
    id: changes
    attributes:
      label: Changes
      description: |
        Optional. Change several fields at once with a JSON object of field name to new value. Use this instead of **Field name** / **New value**, not alongside them.
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **Changing several fields at once**
        
        A JSON object mapping field names to their new values:
        
        ```json
        {
          "n_cells": 220509,
          "southernmost_latitude": -85.3556519090144,
          "description": "The horizontal grid spacing varies locally between about 10 and 120 km."
        }
        ```
        
        Values keep their JSON type, so quote strings and leave numbers and booleans bare. Nested keys work with dot notation, e.g. `"metadata.version": "2.1"`.
        
        Every key must already exist on the file. They are checked before anything is written, so if one is wrong nothing changes and you can fix it and resubmit.
        
        Use this **or** **Field name** / **New value**, never both.
        
        Prefer this whenever one correction spans several fields. All the changes then land in a single commit, so the entry is never published in a part-updated state, and the reviewer sees the whole correction at once instead of a fragment of it.
        
        </details>

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: |
        Explain why this change is needed. Reviewers will use this to decide whether to approve the change.
        
        <details markdown="1">
        <summary>Detailed Guidance</summary>
        
        **Why this change?**
        
        A short explanation that reviewers can use to decide whether to approve. Be specific about what was wrong before and why the new value is correct — cite a paper, a release note, or a model card if you can.
        
        </details>
      placeholder: "e.g. The release_year was originally entered as 2022 but the model paper was published in 2024."
    validations:
      required: true

  - type: input
    id: collaborators
    attributes:
      label: Additional Collaborators
      description: GitHub usernames of additional contributors (comma-separated).
      placeholder: "user1,user2,user3,..."
