<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMD Model Graph</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --ink: #14223a;
    --paper: #f7f5ef;
    --panel: #ffffff;
    --line: #c9d2e0;
    --muted: #5d6b82;

    --c-model: #1f4e79;
    --c-family: #6a3aa8;
    --c-config: #2b3a55;
    --c-hgrid: #1565c0;
    --c-vgrid: #4a90d9;
    --c-subgrid: #6b7280;
    --c-cell: #2d6a4f;

    --dynamic: #d4760a;
    --embedded: #f2c200;
    --nest: #9a8b6d;
    --coupling: #d36a52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace; }

  header { display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap;
    padding: 1rem 1.4rem 0.8rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
  header h1 a#emd-home-link { color: inherit; text-decoration: none; }
  header h1 a#emd-home-link:hover { text-decoration: underline; text-underline-offset: 3px; color: var(--c-model); }
  .controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; font-size: 0.8rem; }
  .controls label { color: var(--muted); }
  select, input, .controls button { font: inherit; font-size: 0.8rem; }
  select, input[type=text] { padding: 0.3rem 0.5rem; border: 1px solid var(--line); border-radius: 3px;
    background: var(--paper); color: var(--ink); }
  input[type=text] { width: 16rem; }
  input[type=number] { width: 3.4rem; padding: 0.3rem 0.4rem; border: 1px solid var(--line);
    border-radius: 3px; background: var(--paper); color: var(--ink); }
  .controls button { padding: 0.32rem 0.8rem; border: 1px solid var(--c-model);
    background: transparent; color: var(--c-model); border-radius: 3px; cursor: pointer; }
  .controls button:hover { background: var(--c-model); color: #fff; }

  .legend { display: flex; gap: 1rem; flex-wrap: wrap; padding: 0.5rem 1.4rem;
    font-size: 0.72rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .swatch { width: 0.9rem; height: 0.9rem; border-radius: 2px; border: 1px solid rgba(0,0,0,0.2); display: inline-block; }
  .swatch.dyn { background: var(--paper); border: 2.5px solid var(--dynamic); }
  .swatch.emb { background: var(--embedded); border: 1px solid var(--dynamic); }
  .swatch.nest { background: transparent; border: 1.5px dashed var(--nest); }

  #status { padding: 0.35rem 1.4rem; font-size: 0.75rem; color: var(--muted);
    min-height: 1.4rem; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 0.6rem; }
  #status.error { color: #b3261e; }
  .spinner {
    width: 0.9rem; height: 0.9rem; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--c-model);
    animation: spin 0.7s linear infinite;
    display: none;
  }
  body.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #wrap.loading::after {
    content: ""; position: absolute;
    top: 0; right: 0; bottom: 0;
    left: var(--rail-w, 110px);     /* don't dim the row-label rail */
    background: rgba(247, 245, 239, 0.55);
    backdrop-filter: blur(1px);
    pointer-events: none;
    animation: pulse 1.4s ease-in-out infinite;
    z-index: 4;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
  .spinner-overlay {
    position: absolute;
    top: 50%;
    /* centre inside the graph area (right of the rail) */
    left: calc(50% + var(--rail-w, 110px) / 2);
    /* translate is part of the keyframe below so the rotation doesn't
       overwrite the centring transform */
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(31, 78, 121, 0.18);
    border-top-color: var(--c-model);
    animation: spin-centred 0.9s linear infinite;
    transform: translate(-50%, -50%);
    z-index: 5;
    display: none;
  }
  @keyframes spin-centred {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }
  #wrap.loading .spinner-overlay { display: block; }

  #wrap { position: relative; width: 100%; height: calc(100vh - 9.5rem); overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }

  .zoombar { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
  .zoombar button { width: 30px; height: 30px; font-size: 1rem; line-height: 1; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); border-radius: 5px; cursor: pointer; }
  .zoombar button:hover { background: var(--c-model); color: #fff; border-color: var(--c-model); }
  .zoombar button.fit { font-size: 0.62rem; letter-spacing: 0.04em; }

  .nest rect {
    fill: rgba(154,139,109,0.06);
    stroke: var(--nest);
    stroke-width: 1.5px;
    stroke-dasharray: 5 4;
    rx: 8; ry: 8;
  }
  .nest text {
    font-size: 9.5px; fill: var(--nest);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    pointer-events: none;
  }

  .link { fill: none; stroke: var(--line); stroke-width: 1.3px; }
  .link.family { stroke: var(--c-family); stroke-dasharray: 4 3; stroke-width: 1.4px; }

  .coupling {
    fill: none;
    stroke: var(--coupling);
    stroke-width: 1.6px;
    stroke-dasharray: 6 4;
    opacity: 0.85;
    pointer-events: none;
  }
  .coupling-dot {
    fill: var(--coupling);
    pointer-events: none;
  }

  .node rect { stroke-width: 1.3px; }
  .node text { font-size: 11px; fill: var(--ink); pointer-events: none; }
  .node .nid { font-weight: 700; }
  .node .meta { fill: var(--muted); font-size: 9.5px; }
  .node .inside { font-size: 10px; font-weight: 600; }
  .node.dynamic rect { stroke-width: 3.4px; }
  .node { cursor: pointer; }

  .focusmode .link { opacity: 0.08; }
  .focusmode .node { opacity: 0.18; }
  .focusmode .nest { opacity: 0.35; }
  .focusmode .coupling, .focusmode .coupling-dot { opacity: 0.12; }
  .link.hot { opacity: 1 !important; stroke: var(--c-model); stroke-width: 2px; }
  .link.family.hot { stroke: var(--c-family); }
  .coupling.hot, .coupling-dot.hot { opacity: 1 !important; }
  .node.hot { opacity: 1 !important; }

  .row-label { font-size: 9px; fill: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .row-rail-bg { fill: var(--paper); }
  .row-rail-sep { stroke: var(--line); stroke-width: 1; }
  .row-label-rail {
    font-size: 0.56rem;
    fill: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-anchor: end;
    dominant-baseline: middle;
  }
</style>
</head>
<body>
<header>
  <h1><a href="../../" id="emd-home-link">EMD</a>&nbsp;·&nbsp;Model Graph</h1>
  <div class="controls">
    <label for="model">Model</label>
    <select id="model"></select>
    <button id="dl">Download SVG</button>
  </div>
</header>

<div class="legend" id="legend"></div>
<div id="status"><span class="spinner" aria-hidden="true"></span><span id="status-text"></span></div>
<div id="wrap">
  <svg id="canvas"></svg>
  <div class="spinner-overlay" aria-hidden="true"></div>
  <div class="zoombar">
    <button id="zin"  title="Zoom in">+</button>
    <button id="zout" title="Zoom out">&minus;</button>
    <button id="zfit" class="fit" title="Fit to view">FIT</button>
  </div>
</div>

<script>
// ===========================================================================
// EMD model graph
//
// Data is always fetched from
//   https://wcrp-cmip.github.io/Essential-Model-Documentation/<folder>/<id>.json
// (overridable with ?base=...). The model id is taken from ?model=<id>.
//
// Physics:
//   * Each node's y is HARD-LOCKED to its tier (model on top, grid cells at the
//     bottom). Vertical position is not negotiable — only x is solved.
//   * Strong many-body repulsion + a generous collision radius means nodes do
//     not touch each other.
//   * embedded_components pairs cluster (parent + its embedded children share
//     a dashed parent-nest box); nests are then pushed apart by a custom
//     pair-wise repulsion so two nests can't overlap.
//   * Nodes are seeded far apart on their row so the simulation has room to
//     reorder them into a sensible left-to-right arrangement before collisions
//     pack them in.
// ===========================================================================

const PARAMS = new URLSearchParams(location.search);
const BASE   = (PARAMS.get("base") || "https://wcrp-cmip.github.io/Essential-Model-Documentation/")
                 .replace(/\/?$/, "/");

// Used only as a fallback if model/_graph.json is unreachable.
const FALLBACK_MODELS = [
  "access-esm1-6", "awi-esm3-4-2-veg-hr", "canesm5-1", "canesm6-0-mr",
  "cnrm-esm2-1e", "ec-earth3-esm-1-1", "ukcm2-0-ll", "ukcm2a-0-hh",
];

// Fetch the model index (folder-level JSON-LD graph) at depth=1 and pull out
// every model id. The EMD index files store their entries under `contents`,
// so we read that array and extract each entry's `@id`.
async function loadModelList() {
  const url = BASE + "model/_graph.json";
  const res = await fetch(url, { headers: { Accept: "application/json" }, mode: "cors" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
  const doc = await res.json();

  const entries = Array.isArray(doc.contents) ? doc.contents : [];
  const ids = entries
    .map(e => (typeof e === "string" ? e : e && e["@id"]))
    .filter(Boolean)
    .map(id => id.split("/").pop().split(":").pop())   // strip prefix / path
    .filter(id => id && !id.startsWith("_"));

  return [...new Set(ids)].sort();
}

// `model_components` is the canonical field on a model file; older CNRM data
// used `component_configs` for the same list — both are accepted.
const FOLDER = {
  "model_components":              "component_config",
  "component_configs":             "component_config",
  "horizontal_computational_grid": "horizontal_computational_grid",
  "vertical_computational_grid":   "vertical_computational_grid",
  "horizontal_subgrids":           "horizontal_subgrid",
  "horizontal_grid_cell":          "horizontal_grid_cell",
  "horizontal_grid_cells":         "horizontal_grid_cell",
  "model_component":               "model_component",
  "family":                        "model_family",
};
const FIELD_TYPE = {
  "model_components":              "component_config",
  "component_configs":             "component_config",
  "horizontal_computational_grid": "horizontal_computational_grid",
  "vertical_computational_grid":   "vertical_computational_grid",
  "horizontal_subgrids":           "horizontal_subgrid",
  "horizontal_grid_cell":          "horizontal_grid_cell",
  "horizontal_grid_cells":         "horizontal_grid_cell",
  "family":                        "model_family",
};

const META = new Set(["@context","@type","@id","validation_key","ui_label",
  "description","alias","references","release_year","calendar","crs","name"]);
const MODEL_META = new Set(["coupling_groups","coupled_components","omitted_components",
  "prescribed_components","dynamic_components","embedded_components","family"]);
const INLINE_VOCAB = new Set(["arrangement","grid_mapping","grid_type",
  "cell_variable_type","vertical_coordinate","realm","units","region",
  "temporal_refinement","truncation_method"]);
const SCALAR = new Set(["n_cells","n_z","n_z_range","x_resolution","y_resolution",
  "westernmost_longitude","southernmost_latitude","truncation_number",
  "bottom_layer_thickness","top_layer_thickness","total_thickness"]);

const KEY_ORDER = ["horizontal_computational_grid","horizontal_subgrids",
  "horizontal_grid_cell","vertical_computational_grid",
  "model_components","component_configs"];

const TYPES = {
  "model":                         { color:"var(--c-model)",   tier:0,  fill:"#1f4e79", text:"#fff" },
  "model_family":                  { color:"var(--c-family)",  tier:-1, fill:"#efe3ff", text:"#3a1b5e" },
  "component_config":              { color:"var(--c-config)",  tier:1,  fill:"#ffffff", text:"#14223a" },
  "vertical_computational_grid":   { color:"var(--c-vgrid)",   tier:2,  fill:"#e3f0fb", text:"#14223a" },
  "horizontal_computational_grid": { color:"var(--c-hgrid)",   tier:3,  fill:"#d3e6fb", text:"#14223a" },
  "horizontal_subgrid":            { color:"var(--c-subgrid)", tier:4,  fill:"#ffffff", text:"#14223a" },
  "horizontal_grid_cell":          { color:"var(--c-cell)",    tier:5,  fill:"#e3f3e9", text:"#14223a" },
};
const ROW_NAME = { "-1":"family","0":"model","1":"realm · component",
  "2":"vertical grid","3":"horizontal grid","4":"subgrid","5":"grid cell" };
const LEFT_RAIL = 80;   // px reserved for the row-label column

// ---------------------------------------------------------------------------
// fetch + cache (always against the configured BASE — never relative)
// ---------------------------------------------------------------------------
const cache = new Map();
async function fetchJson(folder, id) {
  const key = `${folder}/${id}`;
  if (cache.has(key)) return cache.get(key);
  const url = BASE + key + ".json";
  const res = await fetch(url, { headers: { Accept: "application/json" }, mode: "cors" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
  const doc = await res.json();
  cache.set(key, doc);
  return doc;
}

// ---------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------
const short = s => (typeof s === "string" ? s.split("/").pop().split(":").pop() : String(s ?? ""));
function vocab(v) {
  if (typeof v === "string") return short(v);
  if (Array.isArray(v)) return v.map(vocab).filter(Boolean).join(", ");
  if (v && typeof v === "object") return short(v["@id"] || v.validation_key || "");
  return "";
}
const nameOf = item => (typeof item === "string") ? short(item)
  : (item && typeof item === "object") ? short(item["@id"] || item.validation_key || "") : null;

function metaFor(type, n) {
  const out = [];
  if (type === "horizontal_grid_cell") {
    const gt = vocab(n.grid_type); if (gt) out.push(gt);
    if (Number.isInteger(n.n_cells)) out.push(`${n.n_cells.toLocaleString()} cells`);
  } else if (type === "horizontal_computational_grid") {
    const a = vocab(n.arrangement); if (a) out.push(a);
  } else if (type === "vertical_computational_grid") {
    if (n.n_z) out.push(`${n.n_z} levels`);
    const vc = vocab(n.vertical_coordinate); if (vc) out.push(vc);
  } else if (type === "horizontal_subgrid") {
    const c = vocab(n.cell_variable_type); if (c) out.push(c);
  }
  return out;
}

// ---------------------------------------------------------------------------
// resolve model n-deep -> {nodes, links, nests, embedLinks}
// ---------------------------------------------------------------------------
async function buildGraph(modelId, depth) {
  const model = await fetchJson("model", modelId);

  // Every realm mentioned anywhere in the model file — used to extract the
  // realm prefix from a component_config id (some models hyphenate compound
  // realm names like "land-surface", others underscore them as "land_surface").
  const knownRealms = new Set();
  const flat = v => Array.isArray(v) ? v.flat(Infinity) : (v ? [v] : []);
  for (const k of ["dynamic_components","prescribed_components","omitted_components"])
    flat(model[k]).forEach(x => { const n = nameOf(x); if (n) knownRealms.add(n); });
  for (const k of ["coupling_groups","coupled_components","embedded_components"])
    flat(model[k]).forEach(x => { const n = nameOf(x); if (n) knownRealms.add(n); });

  // Realms that show up in coupling_groups / coupled_components are the
  // "host" realms — used to disambiguate any legacy [parent, child] data.
  const coupled = new Set();
  for (const k of ["coupling_groups","coupled_components"])
    flat(model[k]).forEach(x => { const n = nameOf(x); if (n) coupled.add(n); });

  // Canonical convention: embedded_components pairs are [child, parent].
  // Older CNRM data used [parent, child]; if one element of a pair is in the
  // coupled set and the other isn't, we treat the coupled one as the parent.
  const embChild = new Map();
  (model.embedded_components || []).forEach(p => {
    if (!Array.isArray(p) || p.length !== 2) return;
    const a = nameOf(p[0]), b = nameOf(p[1]);
    if (!a || !b) return;
    let parent, child;
    if (coupled.has(b) && !coupled.has(a))      { parent = b; child = a; }
    else if (coupled.has(a) && !coupled.has(b)) { parent = a; child = b; }
    else                                        { parent = b; child = a; }  // assume [child, parent]
    embChild.set(child, parent);
  });
  const dyn = new Set(flat(model.dynamic_components).map(nameOf).filter(Boolean));

  // Coupling pairs (realm names, unordered, deduped).
  const couplingPairs = [];
  {
    const seen = new Set();
    const addPair = (a, b) => {
      if (!a || !b || a === b) return;
      const k = [a, b].sort().join("\u0000");
      if (seen.has(k)) return;
      seen.add(k);
      couplingPairs.push([a, b]);
    };
    // pair-wise direct pairs
    (model.coupled_components || []).forEach(p => {
      if (Array.isArray(p) && p.length === 2) addPair(nameOf(p[0]), nameOf(p[1]));
    });
    // legacy coupling_groups: every realm in a group couples with every other
    (model.coupling_groups || []).forEach(g => {
      if (!Array.isArray(g)) return;
      const m = g.map(nameOf).filter(Boolean);
      for (let i = 0; i < m.length; i++)
        for (let j = i + 1; j < m.length; j++) addPair(m[i], m[j]);
    });
  }

  // Extract the realm slug from a component_config id by matching the longest
  // known realm prefix, tolerating "-" <-> "_" substitution.
  function extractRealm(id) {
    const candidates = [];
    for (const r of knownRealms) {
      candidates.push([r.length, r, r]);
      if (r.includes("-")) candidates.push([r.length, r.replace(/-/g, "_"), r]);
    }
    candidates.sort((a, b) => b[0] - a[0]);
    for (const [, prefix, realm] of candidates) {
      if (id.startsWith(prefix + "_")) return realm;
    }
    return id.split(/[-_]/)[0];
  }

  const nodes = new Map();
  const links = [];
  const add = (id, type, meta, extra = {}) => {
    if (!nodes.has(id)) nodes.set(id, { id, type, label: short(id), meta: meta || [] });
    Object.assign(nodes.get(id), extra);
    return nodes.get(id);
  };
  const link = (a, b, kind = "ref") => links.push({ source: a, target: b, kind });

  const rootId = model["@id"] || modelId;
  add(rootId, "model");

  const fam = model.family;
  if (fam) { const f = nameOf(fam); add(f, "model_family"); link(rootId, f, "family"); }

  async function walk(node, parentId, edgeKey, d) {
    if (Array.isArray(node)) { for (const v of node) await walk(v, parentId, edgeKey, d); return; }
    if (typeof node === "string") {
      const type = FIELD_TYPE[edgeKey];
      if (!parentId || !type) return;
      if (d > 0 && FOLDER[edgeKey]) {
        try { await emit(await fetchJson(FOLDER[edgeKey], node), parentId, edgeKey, d); return; }
        catch (e) { console.warn(`could not resolve ${FOLDER[edgeKey]}/${node}:`, e.message); }
      }
      add(node, type, []);
      if (parentId !== node) link(parentId, node);
      return;
    }
    if (node && typeof node === "object" && node["@id"]) {
      // Object stub like {"@id": "g105"} — try to resolve to the full file so
      // the resulting node carries cell metadata (n_cells, grid_type, ...).
      const ref = node["@id"];
      if (d > 0 && FOLDER[edgeKey] && Object.keys(node).length <= 3) {
        try { await emit(await fetchJson(FOLDER[edgeKey], ref), parentId, edgeKey, d); return; }
        catch (e) { console.warn(`could not resolve stub ${FOLDER[edgeKey]}/${ref}:`, e.message); }
      }
      await emit(node, parentId, edgeKey, d);
    }
  }

  async function emit(node, parentId, edgeKey, d) {
    const type = FIELD_TYPE[edgeKey];
    if (!TYPES[type]) return;
    const id = node["@id"];

    if (type === "component_config") {
      const realm = extractRealm(id);
      let comp = nameOf(node.model_component);
      if (!comp && node.model_component) comp = vocab(node.model_component);
      add(id, type, [], {
        label: realm, inside: comp || "", realm,
        dynamic: dyn.has(realm), embedded: embChild.has(realm),
      });
      if (parentId && parentId !== id) link(parentId, id);
      for (const k of ["horizontal_computational_grid", "vertical_computational_grid"]) {
        if (node[k] !== undefined) await walk(node[k], id, k, d - 1);
      }
      return;
    }

    add(id, type, metaFor(type, node));
    if (parentId && parentId !== id) link(parentId, id);
    const keys = Object.keys(node).sort(
      (a, b) => (KEY_ORDER.indexOf(a) < 0 ? 99 : KEY_ORDER.indexOf(a))
              - (KEY_ORDER.indexOf(b) < 0 ? 99 : KEY_ORDER.indexOf(b)));
    for (const k of keys) {
      if (META.has(k) || MODEL_META.has(k) || INLINE_VOCAB.has(k) || SCALAR.has(k)) continue;
      await walk(node[k], id, k, d - 1);
    }
  }

  const keys = Object.keys(model).sort(
    (a, b) => (KEY_ORDER.indexOf(a) < 0 ? 99 : KEY_ORDER.indexOf(a))
            - (KEY_ORDER.indexOf(b) < 0 ? 99 : KEY_ORDER.indexOf(b)));
  for (const k of keys) {
    if (META.has(k) || MODEL_META.has(k) || INLINE_VOCAB.has(k) || SCALAR.has(k)) continue;
    await walk(model[k], rootId, k, depth);
  }

  // parent nests
  const byRealm = new Map();
  for (const n of nodes.values())
    if (n.type === "component_config" && n.realm) byRealm.set(n.realm, n);
  const grouped = new Map();
  for (const [childRealm, parentRealm] of embChild) {
    const childNode = byRealm.get(childRealm);
    if (!childNode) continue;
    if (!grouped.has(parentRealm)) grouped.set(parentRealm, []);
    grouped.get(parentRealm).push(childNode);
  }
  const nests = [], embedLinks = [];
  for (const [parentRealm, childNodes] of grouped) {
    const parentNode = byRealm.get(parentRealm);
    if (!parentNode) continue;
    nests.push({ id: `nest:${parentRealm}`, parent: parentRealm,
                 members: [parentNode, ...childNodes] });
    for (const child of childNodes) embedLinks.push({ source: parentNode.id, target: child.id });
  }
  // resolve couplings to realm-cell node ids
  const couplings = [];
  for (const [ra, rb] of couplingPairs) {
    const a = byRealm.get(ra), b = byRealm.get(rb);
    if (a && b) couplings.push({ source: a.id, target: b.id, ra, rb });
  }

  // assign each node its nest (or null) for the repulsion force
  const nestByNode = new Map();
  nests.forEach(n => n.members.forEach(m => nestByNode.set(m.id, n)));
  nodes.forEach(n => { n.nest = nestByNode.get(n.id) || null; });

  return { rootId, nodes: [...nodes.values()], links, nests, embedLinks, couplings };
}

// ---------------------------------------------------------------------------
// node sizing
// ---------------------------------------------------------------------------
function sizeNode(d) {
  const lines = [d.label, ...(d.inside ? [d.inside] : []), ...(d.meta || [])];
  d.w = Math.max(92, d3.max(lines, s => (s ? s.length : 0) * 6.6) + 18);
  d.h = 24 + (lines.length - 1) * 12;
  d.r = Math.hypot(d.w / 2, d.h / 2);
}

// ---------------------------------------------------------------------------
// D3 render
// ---------------------------------------------------------------------------
const svg = d3.select("#canvas");
const statusEl     = document.getElementById("status");
const statusTextEl = document.getElementById("status-text");
const wrapEl       = document.getElementById("wrap");
wrapEl.style.setProperty("--rail-w", LEFT_RAIL + "px");
const setStatus = (m, e) => { statusTextEl.textContent = m; statusEl.className = e ? "error" : ""; };
const setLoading = on => {
  document.body.classList.toggle("loading", on);
  wrapEl.classList.toggle("loading", on);
};

let zoom, rootG, currentSim, currentGraph;

function render(graph) {
  if (currentSim) currentSim.stop();
  svg.selectAll("*").remove();
  currentGraph = graph;
  const W = document.getElementById("wrap").clientWidth;
  const H = document.getElementById("wrap").clientHeight;
  rootG = svg.append("g");

  const byId = new Map(graph.nodes.map(n => [n.id, n]));
  graph.nodes.forEach(n => { n.tier = TYPES[n.type]?.tier ?? 3; sizeNode(n); });

  const tiersPresent = [...new Set(graph.nodes.map(n => n.tier))].sort((a, b) => a - b);
  const rowGap = Math.max(120, (H - 90) / Math.max(tiersPresent.length, 1));
  const marginTop = 55;
  const rowY = new Map(tiersPresent.map((t, i) => [t, marginTop + i * rowGap]));

  // ---- initial layout: spread each tier across a wide range so the sim can
  // discover a good ordering before collide forces compress them.
  const SPREAD = Math.max(W * 2.5, 1800);
  const tierBuckets = d3.groups(graph.nodes, n => n.tier);
  tierBuckets.forEach(([tier, members]) => {
    const y = rowY.get(tier);
    members.sort((a, b) => a.id.localeCompare(b.id));
    const step = SPREAD / Math.max(members.length, 1);
    members.forEach((n, i) => {
      n.targetY = y;
      n.y  = y;
      n.fy = y;                     // HARD LOCK to tier row — y is fixed
      n.x  = W / 2 - SPREAD / 2 + step * (i + 0.5);
    });
  });

  // adjacency (for hover spotlight) — includes parent/child edges AND coupling partners
  const parents = new Map(), children = new Map(), coupledWith = new Map();
  graph.nodes.forEach(n => {
    parents.set(n.id, new Set());
    children.set(n.id, new Set());
    coupledWith.set(n.id, new Set());
  });
  graph.links.forEach(l => {
    const s = typeof l.source === "object" ? l.source.id : l.source;
    const t = typeof l.target === "object" ? l.target.id : l.target;
    children.get(s)?.add(t); parents.get(t)?.add(s);
  });
  (graph.couplings || []).forEach(c => {
    coupledWith.get(c.source)?.add(c.target);
    coupledWith.get(c.target)?.add(c.source);
  });

  // nests (drawn behind everything)
  const nestG = rootG.append("g").attr("class", "nests");
  const nestSel = nestG.selectAll("g.nest").data(graph.nests).join("g").attr("class", "nest");
  nestSel.append("rect");
  nestSel.append("text").text(d => d.parent);

  // (Row labels are drawn outside rootG below so they're never panned/zoomed.)

  // links
  const linkSel = rootG.append("g").selectAll("path").data(graph.links).join("path")
    .attr("class", d => "link" + (d.kind === "family" ? " family" : ""));

  // coupling arcs (dashed bilinks between coupled realm cells)
  const coupleG = rootG.append("g").attr("class", "couplings");
  const coupleSel = coupleG.selectAll("path.coupling").data(graph.couplings || []).join("path")
    .attr("class", "coupling");
  const coupleDotSel = coupleG.selectAll("g.coupling-ends").data(graph.couplings || []).join("g")
    .attr("class", "coupling-ends");
  coupleDotSel.append("circle").attr("class", "coupling-dot").attr("r", 2.6);
  coupleDotSel.append("circle").attr("class", "coupling-dot end-b").attr("r", 2.6);

  // nodes
  const nodeSel = rootG.append("g").selectAll("g.node").data(graph.nodes).join("g")
    .attr("class", d => "node" + (d.dynamic ? " dynamic" : ""));

  nodeSel.each(function (d) {
    const g = d3.select(this), cfg = TYPES[d.type] || {};
    g.append("rect")
      .attr("x", -d.w / 2).attr("y", -d.h / 2).attr("width", d.w).attr("height", d.h)
      .attr("rx", 4).attr("ry", 4)
      .attr("fill", d.embedded ? "var(--embedded)" : (cfg.fill || "#fff"))
      .attr("stroke", d.dynamic ? "var(--dynamic)" : (cfg.color || "#333"));
    const tx = g.append("text").attr("text-anchor", "middle").attr("y", -d.h / 2 + 14);
    tx.append("tspan").attr("class", "nid").attr("x", 0)
      .attr("fill", d.embedded ? "#3a2a00" : (cfg.text || "var(--ink)")).text(d.label);
    if (d.inside)
      tx.append("tspan").attr("class", "inside").attr("x", 0).attr("dy", 12)
        .attr("fill", d.embedded ? "#5a3a00" : "var(--c-config)").text(d.inside);
    (d.meta || []).forEach(m =>
      tx.append("tspan").attr("class", "meta").attr("x", 0).attr("dy", 12).text(m));
  });

  // hover: spotlight self + parents + children
  nodeSel
    .on("mouseenter", (event, d) => {
      const hot = new Set([d.id,
        ...parents.get(d.id), ...children.get(d.id), ...coupledWith.get(d.id)]);
      svg.classed("focusmode", true);
      nodeSel.classed("hot", n => hot.has(n.id));
      linkSel.classed("hot", l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        return (s === d.id && hot.has(t)) || (t === d.id && hot.has(s));
      });
      coupleSel.classed("hot", c => c.source === d.id || c.target === d.id);
      coupleDotSel.classed("hot", c => c.source === d.id || c.target === d.id);
    })
    .on("mouseleave", () => {
      svg.classed("focusmode", false);
      nodeSel.classed("hot", false);
      linkSel.classed("hot", false);
      coupleSel.classed("hot", false);
      coupleDotSel.classed("hot", false);
    });

  // ---- custom force: push nests apart when they overlap horizontally
  function forceNestRepulsion(alpha) {
    const ns = graph.nests;
    if (!ns || ns.length < 2) return;
    const metrics = ns.map(nest => {
      let lo = Infinity, hi = -Infinity, sum = 0;
      nest.members.forEach(n => { lo = Math.min(lo, n.x - n.w / 2); hi = Math.max(hi, n.x + n.w / 2); sum += n.x; });
      return { lo, hi, cx: sum / nest.members.length, w: hi - lo };
    });
    const GAP = 120;
    for (let i = 0; i < ns.length; i++) {
      for (let j = i + 1; j < ns.length; j++) {
        const a = metrics[i], b = metrics[j];
        const dx = b.cx - a.cx;
        const minSep = (a.w + b.w) / 2 + GAP;
        if (Math.abs(dx) >= minSep) continue;
        const overlap = minSep - Math.abs(dx);
        const push = overlap * alpha * 0.5;
        const sign = dx === 0 ? 1 : Math.sign(dx);
        ns[i].members.forEach(n => { n.vx = (n.vx || 0) - sign * push; });
        ns[j].members.forEach(n => { n.vx = (n.vx || 0) + sign * push; });
      }
    }
  }

  // ---- force simulation: y is locked, x is solved
  const sim = d3.forceSimulation(graph.nodes)
    .force("x",        d3.forceX(W / 2).strength(0.02))
    .force("charge",   d3.forceManyBody().strength(-450).distanceMax(500))
    .force("link",     d3.forceLink(graph.links).id(d => d.id).distance(0).strength(0.1))
    .force("embed",    d3.forceLink(graph.embedLinks || []).id(d => d.id)
                         .distance(d => (d.source.w + d.target.w) / 2 + 18)
                         .strength(0.55))
    .force("collide",  d3.forceCollide(d => d.r + 14).strength(1).iterations(3))
    .force("nestRepel", forceNestRepulsion)
    .alphaDecay(0.018)
    .on("tick", ticked);
  currentSim = sim;

  function ticked() {
    linkSel.attr("d", d => {
      const s = d.source, t = d.target;
      const sy = s.y + s.h / 2, ty = t.y - t.h / 2;
      const my = (sy + ty) / 2;
      return `M${s.x},${sy} C${s.x},${my} ${t.x},${my} ${t.x},${ty}`;
    });
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);

    // coupling arcs — bow UPWARD above the realm row so they stay clear of
    // the downward tree edges
    const byId = new Map(graph.nodes.map(n => [n.id, n]));
    coupleSel.attr("d", c => {
      const s = byId.get(c.source), t = byId.get(c.target);
      if (!s || !t) return null;
      const x1 = s.x, y1 = s.y - s.h / 2;
      const x2 = t.x, y2 = t.y - t.h / 2;
      const mx = (x1 + x2) / 2;
      const dx = Math.abs(x2 - x1);
      const lift = Math.min(120, 30 + dx * 0.18);
      const cy = Math.min(y1, y2) - lift;
      return `M${x1},${y1} Q${mx},${cy} ${x2},${y2}`;
    });
    coupleDotSel.each(function (c) {
      const s = byId.get(c.source), t = byId.get(c.target);
      if (!s || !t) return;
      const g = d3.select(this);
      g.selectAll("circle").nodes().forEach((node, i) => {
        const target = i === 0 ? s : t;
        d3.select(node).attr("cx", target.x).attr("cy", target.y - target.h / 2);
      });
    });

    // nest rectangles follow the live bounding boxes of their members
    const PAD = 14;
    nestSel.each(function (nest) {
      let lx = Infinity, rx = -Infinity, ty = Infinity, by = -Infinity;
      nest.members.forEach(n => {
        lx = Math.min(lx, n.x - n.w / 2); rx = Math.max(rx, n.x + n.w / 2);
        ty = Math.min(ty, n.y - n.h / 2); by = Math.max(by, n.y + n.h / 2);
      });
      const x = lx - PAD, y = ty - PAD - 4, w = (rx - lx) + 2 * PAD, h = (by - ty) + 2 * PAD + 4;
      const g = d3.select(this);
      g.select("rect").attr("x", x).attr("y", y).attr("width", w).attr("height", h);
      g.select("text").attr("x", x + 9).attr("y", y + 14);
    });
  }

  // drag — horizontal only (y stays locked to tier)
  nodeSel.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; })
    .on("drag",  (e, d) => { d.fx = e.x; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; }));

  // zoom / pan — rootG is the zoomable layer; the row rail (added below)
  // stays in screen coords and is updated on every zoom event.
  zoom = d3.zoom().scaleExtent([0.03, 4]).on("zoom", e => {
    rootG.attr("transform", e.transform);
    updateRail(e.transform);
  });
  svg.call(zoom);

  // ---- fixed left rail: row descriptions, drawn ON TOP of the graph so the
  // graph can never bleed into the label column.
  const railG = svg.append("g").attr("class", "row-rail").style("pointer-events", "none");
  railG.append("rect").attr("class", "row-rail-bg")
    .attr("x", 0).attr("y", 0).attr("width", LEFT_RAIL).attr("height", "100%");
  railG.append("line").attr("class", "row-rail-sep")
    .attr("x1", LEFT_RAIL).attr("y1", 0).attr("x2", LEFT_RAIL).attr("y2", "100%");
  const railSel = railG.selectAll("text.row-label-rail").data(tiersPresent).join("text")
    .attr("class", "row-label-rail")
    .attr("x", LEFT_RAIL - 8)
    .text(t => ROW_NAME[String(t)] || "");

  function updateRail(t) {
    railSel.attr("y", tier => t.y + t.k * rowY.get(tier));
  }
  updateRail(d3.zoomIdentity);   // initial — before fit fires its zoom event

  // settle off-screen, fit, then refit when simulation truly ends
  sim.alpha(1).restart();
  for (let i = 0; i < 600; i++) sim.tick();
  ticked();
  fit(graph);
  sim.on("end.fit", () => fit(graph));
}

function fit(graph) {
  if (!zoom || !graph) return;
  const W = document.getElementById("wrap").clientWidth;
  const H = document.getElementById("wrap").clientHeight;
  const padR = 40, padTB = 50;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  graph.nodes.forEach(n => {
    minX = Math.min(minX, n.x - n.w / 2);
    maxX = Math.max(maxX, n.x + n.w / 2);
    minY = Math.min(minY, n.y - n.h / 2);
    maxY = Math.max(maxY, n.y + n.h / 2);
  });
  const spanX = Math.max(maxX - minX, 10);
  const spanY = Math.max(maxY - minY, 10);
  const availW = Math.max(W - LEFT_RAIL - padR, 100);
  const availH = Math.max(H - 2 * padTB, 100);
  const scale  = Math.min(availW / spanX, availH / spanY);
  const tx = LEFT_RAIL + (availW - scale * spanX) / 2 - scale * minX;
  const ty = padTB     + (availH - scale * spanY) / 2 - scale * minY;
  svg.transition().duration(400).call(zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function buildLegend() {
  document.getElementById("legend").innerHTML =
      `<span><i class="swatch dyn"></i>dynamic</span>`
    + `<span><i class="swatch emb"></i>embedded</span>`
    + `<span><i class="swatch nest"></i>parent nest</span>`
    + `<span><svg width="22" height="10" style="vertical-align:middle"><path d="M2,8 Q11,1 20,8" stroke="var(--coupling)" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/></svg>coupling</span>`;
}

// ---------------------------------------------------------------------------
// URL ↔ UI sync (history.replaceState wrapped because file:// origins fail it)
// ---------------------------------------------------------------------------
function normaliseId(s) {
  return (s || "").trim().replace(/^model\//, "").replace(/\.json$/i, "");
}
function readQuery() {
  const p = new URLSearchParams(location.search);
  return {
    model: normaliseId(p.get("model") || p.get("id") || ""),
    depth: parseInt(p.get("depth"), 10) || 6,
  };
}
function writeQuery(id, depth) {
  const p = new URLSearchParams();
  if (id)                    p.set("model", id);
  if (depth && depth !== 6)  p.set("depth", String(depth));
  if (PARAMS.get("base"))    p.set("base", PARAMS.get("base"));
  const next = location.pathname + (p.toString() ? "?" + p.toString() : "");
  try { history.replaceState(null, "", next); }
  catch (_) { /* file:// origins reject replaceState in some browsers — ignore */ }
}

// ---------------------------------------------------------------------------
// controls
// ---------------------------------------------------------------------------
async function run(id, depth) {
  id    = normaliseId(id);
  depth = depth || DEFAULT_DEPTH;
  if (!id) { setStatus("No model id."); return; }
  setLoading(true);
  setStatus(`Loading ${id}…`);
  try {
    cache.clear();
    const graph = await buildGraph(id, depth);
    render(graph);
    setStatus(`${graph.nodes.length} nodes · ${graph.links.length} links · ${graph.couplings.length} couplings · ${id}`);
    writeQuery(id, depth);
  } catch (e) {
    console.error(e);
    setStatus(`Error: ${e.message}`, true);
  } finally {
    setLoading(false);
  }
}

const DEFAULT_DEPTH = 8;

function currentId() { return normaliseId(document.getElementById("model").value); }

async function init() {
  buildLegend();
  const sel = document.getElementById("model");
  sel.innerHTML = `<option>loading…</option>`;
  sel.disabled = true;

  const q = readQuery();
  const startId = q.model || "ec-earth3-esm-1-1";

  // Kick off render immediately using the URL/default model — don't make the
  // user wait for the index to come back.
  run(startId, q.depth || DEFAULT_DEPTH);

  // Populate the dropdown asynchronously.
  let knownModels;
  try {
    knownModels = await loadModelList();
    if (!knownModels.length) throw new Error("empty model index");
  } catch (e) {
    console.warn("model/_graph.json fetch failed, using fallback list:", e.message);
    knownModels = FALLBACK_MODELS.slice();
  }
  if (startId && !knownModels.includes(startId)) knownModels = [startId, ...knownModels];

  sel.innerHTML = knownModels.map(id => `<option value="${id}">${id}</option>`).join("");
  sel.value = startId;
  sel.disabled = false;

  sel.addEventListener("change", () => run(sel.value, DEFAULT_DEPTH));
  window.addEventListener("popstate", () => {
    const q = readQuery();
    if (!q.model) return;
    if (!Array.from(sel.options).some(o => o.value === q.model)) {
      sel.insertAdjacentHTML("afterbegin", `<option value="${q.model}">${q.model}</option>`);
    }
    sel.value = q.model;
    run(q.model, DEFAULT_DEPTH);
  });

  document.getElementById("zin").addEventListener("click",
    () => svg.transition().duration(200).call(zoom.scaleBy, 1.4));
  document.getElementById("zout").addEventListener("click",
    () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.4));
  document.getElementById("zfit").addEventListener("click", () => fit(currentGraph));

  let rT;
  window.addEventListener("resize", () => {
    clearTimeout(rT);
    rT = setTimeout(() => { if (currentGraph) render(currentGraph); }, 250);
  });
}

document.getElementById("dl").addEventListener("click", () => {
  const blob = new Blob([`<?xml version="1.0"?>\n` + document.getElementById("canvas").outerHTML],
    { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (currentId() || "emd") + ".svg";
  a.click();
});

  /* Scrim */
  var scrim=document.createElement('div');
  scrim.id='emd-nav-scrim';
  document.body.appendChild(scrim);

  /* Drawer */
  var drawer=document.createElement('div');
  drawer.id='emd-nav-drawer';
  var hdr=document.createElement('div');
  hdr.id='emd-nav-drawer-header';
  var ttl=document.createElement('span');
  ttl.id='emd-nav-drawer-title';
  ttl.textContent='Navigation';
  var cls=document.createElement('button');
  cls.id='emd-nav-drawer-close';
  cls.setAttribute('aria-label','Close navigation');
  cls.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  hdr.appendChild(ttl);hdr.appendChild(cls);
  drawer.appendChild(hdr);
  var navWrap=document.createElement('div');
  navWrap.innerHTML=navHtml();
  drawer.appendChild(navWrap);
  document.body.appendChild(drawer);

  /* Tab */
  var tab=document.createElement('div');
  tab.id='emd-nav-tab';
  tab.setAttribute('aria-label','Open navigation');
  tab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
  document.body.appendChild(tab);

  function openDrawer(){
    drawer.classList.add('open');
    scrim.classList.add('open');
    tab.classList.add('hidden');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    scrim.classList.remove('open');
    tab.classList.remove('hidden');
  }
  tab.addEventListener('click', openDrawer);
  cls.addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});
}

function initMkDocs(){
  /* MkDocs-themed page — inject into sidebar slot */
  var s=document.querySelector('[data-slot="sidebar-content"]');
  if(!s)return false;
  var old=s.querySelector('#custom-nav');if(old)old.remove();
  var sp=s.querySelector('.h-\\(--top-spacing\\)');
  var d=document.createElement('div');d.innerHTML=navHtml();
  if(sp&&sp.nextSibling)s.insertBefore(d.firstChild,sp.nextSibling);else s.appendChild(d.firstChild);

  /* Mobile drawer */
  if(!document.getElementById('mobile-nav-overlay')){
    var o=document.createElement('div');
    o.id='mobile-nav-overlay';
    o.innerHTML='<div id="mobile-nav-drawer">'+navHtml()+'</div>';
    o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});
    document.body.appendChild(o);
    var b=document.getElementById('menu-button');
    if(b)b.addEventListener('click',function(e){e.stopPropagation();o.classList.toggle('open');});
  }
  return true;
}

function init(){
  if(!initMkDocs()) initStandalone();
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
</html>
